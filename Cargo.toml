[package]
name = "tree-sitter-razor"
description = "Razor Grammar, particularly tuned towards Blazor flavour of Razor"
version = "0.1.0"
authors = ["Sathiyaraman-M <Sathiyaraman2003@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "razor"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/sathiyaraman-m/tree-sitter-razor"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.3"
